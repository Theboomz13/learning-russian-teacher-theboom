<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Русский сезон А1 — ระบบคลังข้อสอบและแบบฝึกหัด</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Roboto", "Noto Sans Thai", sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #0f172a;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }
    h1, h2, h3 { margin-top: 0; }
    .muted { color: #64748b; font-size: 13px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    @media (max-width: 680px) { .grid-2 { grid-template-columns: 1fr; } }

    input, select, button {
      font-family: inherit;
      font-size: 14px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    button {
      background: #1d4ed8;
      color: #ffffff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1e40af; }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    button.secondary:hover { background: #cbd5e1; }

    .kpi {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 14px;
    }
    .kpi-num { font-size: 26px; font-weight: 700; color: #1d4ed8; }
    .kpi-label { font-size: 13px; color: #475569; margin-top: 4px; }

    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .tab-btn { background: #e2e8f0; color: #1e293b; }
    .tab-btn.active { background: #1d4ed8; color: #ffffff; }

    .q-box {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      background: #f8fafc;
    }
    .choice { display: block; margin: 6px 0; cursor: pointer; }
    .ok-text { color: #15803d; font-weight: 600; }
    .err-text { color: #b91c1c; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 10px; text-align: left; }
    th { background: #f8fafc; font-weight: 700; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- ส่วนหัวและตรวจสอบสิทธิ์ -->
  <div class="card">
    <h1>Русский сезон А1 — คลังข้อสอบและแบบฝึกหัด</h1>

    <div id="authBox">
      <div class="row" style="margin-bottom: 10px;">
        <input id="loginUser" type="text" placeholder="ชื่อผู้ใช้ (User)" />
        <input id="loginPass" type="password" placeholder="รหัสผ่าน (Password)" />
        <button onclick="onLogin()">ลงชื่อเข้าใช้</button>
        <button class="secondary" onclick="toggleRegister()">สมัครผู้เรียนใหม่</button>
      </div>
      <div id="authMsg"></div>

      <div id="registerPanel" style="display:none; margin-top:12px; padding-top:12px; border-top:1px dashed #cbd5e1;">
        <h3>สมัครบัญชีผู้เรียนใหม่</h3>
        <div class="grid-2" style="margin-bottom:8px;">
          <input id="regUser" type="text" placeholder="ชื่อผู้ใช้ (User) *" />
          <input id="regPass" type="password" placeholder="รหัสผ่าน (Password) *" />
          <input id="regName" type="text" placeholder="ชื่อ-นามสกุล *" />
          <select id="regSchool" onchange="onSelectSchool()">
            <option value="">-- เลือกโรงเรียน --</option>
          </select>
          <input id="regProvince" type="text" placeholder="จังหวัด" />
          <input id="regLevel" type="text" placeholder="ระดับชั้น" />
        </div>
        <div class="row">
          <input id="regContact" type="text" style="flex:1;" placeholder="อีเมลหรือเบอร์ติดต่อ" />
          <button onclick="onRegister()">ยืนยันสมัครสมาชิก</button>
        </div>
      </div>
    </div>

    <div id="sessionBar" style="display:none;" class="row">
      <span id="sessionInfo"></span>
      <button class="secondary" onclick="onLogout()">ออกจากระบบ</button>
    </div>

    <div class="grid-3" style="margin-top:16px;">
      <div class="kpi">
        <div class="kpi-num" id="statTotal">-</div>
        <div class="kpi-label">จำนวนข้อสอบทั้งหมดในคลัง</div>
      </div>
      <div class="kpi">
        <div class="kpi-num" id="statChapter">-</div>
        <div class="kpi-label">จำนวนข้อสอบในบทที่เลือก</div>
      </div>
      <div class="kpi">
        <div class="kpi-num">20</div>
        <div class="kpi-label">จำนวนข้อที่ระบบสุ่มใช้ต่อบท</div>
      </div>
    </div>
  </div>

  <!-- แท็บเมนู -->
  <div class="tabs">
    <button class="tab-btn active" id="btnTabQuiz" onclick="openTab('quiz')">ทำแบบฝึกหัด (สุ่ม 20 ข้อ)</button>
    <button class="tab-btn" id="btnTabHistory" onclick="openTab('history')">ประวัติผลการเรียน</button>
    <button class="tab-btn" id="btnTabAdmin" style="display:none;" onclick="openTab('admin')">เพิ่มข้อสอบ (Admin)</button>
  </div>

  <!-- ทำแบบฝึกหัด -->
  <div class="card" id="secQuiz">
    <h2>ทำแบบฝึกหัดรายบท (สุ่ม 20 ข้อต่อบท)</h2>
    <div class="row">
      <label for="chapterSelect">เลือกบทที่:</label>
      <select id="chapterSelect" onchange="updateChapterStat()"></select>
      <button onclick="startChapterQuiz()">สุ่มข้อสอบ (20 ข้อ)</button>
    </div>
    <div id="quizMeta" class="muted" style="margin-top:8px;"></div>
    <form id="quizForm" onsubmit="submitQuiz(event)" style="margin-top:12px;"></form>
    <div id="quizResult" style="margin-top:14px;"></div>
  </div>

  <!-- ประวัติผลการเรียน -->
  <div class="card" id="secHistory" style="display:none;">
    <h2>ประวัติผลการเรียนและแบบฝึกหัด</h2>
    <div class="row"><button class="secondary" onclick="loadHistory()">รีเฟรชข้อมูล</button></div>
    <div id="historyContent">กรุณาลงชื่อเข้าใช้ก่อนดูประวัติ</div>
  </div>

  <!-- เพิ่มข้อสอบสำหรับ Admin -->
  <div class="card" id="secAdmin" style="display:none;">
    <h2>เพิ่มข้อสอบเข้าคลัง (สำหรับ Admin)</h2>
    <div class="grid-2" style="margin-bottom:10px;">
      <input id="addChapter" type="number" min="1" placeholder="สำหรับบทที่ (เช่น 1–10)" />
      <input id="addWeight" type="number" min="1" value="1" placeholder="น้ำหนักคะแนน (ค่าเริ่มต้น 1)" />
    </div>
    <div style="margin-bottom:10px;">
      <input id="addQuestion" type="text" style="width:100%;" placeholder="โจทย์คำถาม" />
    </div>
    <div class="grid-2" style="margin-bottom:10px;">
      <input id="addC1" type="text" placeholder="ตัวเลือก 1" />
      <input id="addC2" type="text" placeholder="ตัวเลือก 2" />
      <input id="addC3" type="text" placeholder="ตัวเลือก 3" />
      <input id="addC4" type="text" placeholder="ตัวเลือก 4" />
    </div>
    <div class="row">
      <input id="addAnswer" type="text" style="flex:1;" placeholder="เฉลย (ระบุให้ตรงกับตัวเลือกที่ถูก)" />
      <button onclick="saveNewQuestion()">บันทึกเข้าคลังข้อสอบ</button>
    </div>
    <div id="addMsg" style="margin-top:10px;"></div>
  </div>

</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwYWUqzGEftT4yRQceF_Hu2dUAkD5ZC93vlRbJC7dr-4teTpgBJwAJ9si5Uttg72JsC/exec";

  let currentUser = null;
  let currentStats = null;
  let schoolCache = [];
  let quizList = [];

  function callServer(fnName, argsObj, cb) {
    if (window.google && google.script && google.script.run && window.location.hostname.includes('googleusercontent.com')) {
      const runner = google.script.run
        .withSuccessHandler(res => cb(null, res))
        .withFailureHandler(err => cb(err, null));

      if (fnName === 'verifyLogin') runner.verifyLogin(argsObj.username, argsObj.password);
      else if (fnName === 'registerUser') runner.registerUser(argsObj);
      else if (fnName === 'getSchools') runner.getSchools();
      else if (fnName === 'getQuestionBankStats') runner.getQuestionBankStats();
      else if (fnName === 'getRandomQuestions') runner.getRandomQuestions(argsObj.chapter, argsObj.limit);
      else if (fnName === 'submitQuizResult') runner.submitQuizResult(argsObj);
      else if (fnName === 'addQuestion') runner.addQuestion(argsObj.user, argsObj.questionData);
      else if (fnName === 'getLearningHistory') runner.getLearningHistory(argsObj.user);
      return;
    }

    const actionMap = {
      verifyLogin: 'login',
      registerUser: 'register',
      getSchools: 'schools',
      getQuestionBankStats: 'stats',
      getRandomQuestions: 'quiz',
      submitQuizResult: 'submit',
      addQuestion: 'addQuestion',
      getLearningHistory: 'history'
    };

    const payload = Object.assign({ action: actionMap[fnName] }, argsObj || {});
    fetch(WEB_APP_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(data => {
        if (fnName === 'getQuestionBankStats') cb(null, data.stats);
        else if (fnName === 'getSchools') cb(null, data.schools);
        else if (fnName === 'getRandomQuestions') cb(null, data.quiz);
        else if (fnName === 'getLearningHistory') cb(null, data.records);
        else cb(null, data);
      })
      .catch(err => cb(err, null));
  }

  window.onload = function() {
    refreshStats();
    loadSchools();
  };

  function openTab(tab) {
    ['quiz', 'history', 'admin'].forEach(name => {
      const capName = name.charAt(0).toUpperCase() + name.slice(1);
      document.getElementById('sec' + capName).style.display = (name === tab) ? 'block' : 'none';
      const btn = document.getElementById('btnTab' + capName);
      if (btn) btn.classList.toggle('active', name === tab);
    });
    if (tab === 'history') loadHistory();
  }

  function toggleRegister() {
    const el = document.getElementById('registerPanel');
    el.style.display = (el.style.display === 'none') ? 'block' : 'none';
  }

  function loadSchools() {
    callServer('getSchools', {}, (err, list) => {
      if (err || !list) return;
      schoolCache = list;
      const sel = document.getElementById('regSchool');
      sel.innerHTML = '<option value="">-- เลือกโรงเรียน --</option>';
      list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.school;
        opt.textContent = item.school + (item.province ? ' (' + item.province + ')' : '');
        sel.appendChild(opt);
      });
    });
  }

  function onSelectSchool() {
    const val = document.getElementById('regSchool').value;
    const found = schoolCache.find(s => s.school === val);
    if (found && found.province) {
      document.getElementById('regProvince').value = found.province;
    }
  }

  function onLogin() {
    const username = document.getElementById('loginUser').value;
    const password = document.getElementById('loginPass').value;
    callServer('verifyLogin', { username, password }, (err, res) => {
      const msg = document.getElementById('authMsg');
      if (err) {
        msg.innerHTML = '<span class="err-text">ไม่สามารถเชื่อมต่อ Web App ได้ กรุณาตรวจสอบสิทธิ์การเข้าถึงเป็น Anyone</span>';
        return;
      }
      if (!res || !res.ok) {
        msg.innerHTML = `<span class="err-text">${(res && res.message) || 'เข้าสู่ระบบไม่สำเร็จ'}</span>`;
        return;
      }
      msg.innerHTML = '';
      setActiveSession(res.user);
    });
  }

  function onRegister() {
    const payload = {
      username: document.getElementById('regUser').value,
      password: document.getElementById('regPass').value,
      fullName: document.getElementById('regName').value,
      school: document.getElementById('regSchool').value,
      province: document.getElementById('regProvince').value,
      levelOrPos: document.getElementById('regLevel').value,
      contact: document.getElementById('regContact').value
    };
    callServer('registerUser', payload, (err, res) => {
      const msg = document.getElementById('authMsg');
      if (err || !res || !res.ok) {
        msg.innerHTML = `<span class="err-text">${(res && res.message) || 'สมัครสมาชิกไม่สำเร็จ'}</span>`;
        return;
      }
      msg.innerHTML = `<span class="ok-text">${res.message}</span>`;
      document.getElementById('registerPanel').style.display = 'none';
      setActiveSession(res.user);
    });
  }

  function setActiveSession(user) {
    currentUser = user;
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('sessionBar').style.display = 'flex';
    document.getElementById('sessionInfo').innerHTML =
      `<b>${user.fullName}</b> (@${user.username}) · สิทธิ์: <b>${user.role}</b> · ${user.school || '-'}`;

    const isAdmin = (user.role === 'Admin' || Number(user.roleId) === 1);
    document.getElementById('btnTabAdmin').style.display = isAdmin ? 'inline-block' : 'none';
    if (!isAdmin) openTab('quiz');
    loadHistory();
  }

  function onLogout() {
    currentUser = null;
    document.getElementById('authBox').style.display = 'block';
    document.getElementById('sessionBar').style.display = 'none';
    document.getElementById('btnTabAdmin').style.display = 'none';
    document.getElementById('historyContent').innerHTML = 'กรุณาลงชื่อเข้าใช้ก่อนดูประวัติ';
    openTab('quiz');
  }

  function refreshStats() {
    callServer('getQuestionBankStats', {}, (err, stats) => {
      if (err || !stats) return;
      currentStats = stats;
      document.getElementById('statTotal').textContent = stats.totalQuestions + ' ข้อ';

      const sel = document.getElementById('chapterSelect');
      const prev = sel.value;
      sel.innerHTML = '';

      stats.chapters.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.chapter;
        opt.textContent = `บทที่ ${c.chapter} (ในคลัง ${c.availableCount} ข้อ · สุ่ม ${c.quizCount} ข้อ)`;
        sel.appendChild(opt);
      });

      if (prev) sel.value = prev;
      updateChapterStat();
    });
  }

  function updateChapterStat() {
    if (!currentStats) return;
    const ch = Number(document.getElementById('chapterSelect').value);
    const found = currentStats.chapters.find(item => item.chapter === ch);
    document.getElementById('statChapter').textContent = (found ? found.availableCount : 0) + ' ข้อ';
  }

  function startChapterQuiz() {
    const ch = Number(document.getElementById('chapterSelect').value);
    document.getElementById('quizResult').innerHTML = '';
    document.getElementById('quizMeta').textContent = 'กำลังสุ่มคำถาม 20 ข้อ...';

    callServer('getRandomQuestions', { chapter: ch, limit: 20 }, (err, data) => {
      if (err || !data) return;
      quizList = data.questions || [];
      document.getElementById('quizMeta').textContent =
        `บทที่ ${data.chapter} — มีข้อสอบในคลังทั้งหมด ${data.availableInBank} ข้อ | สุ่มมาใช้รอบนี้ ${quizList.length} ข้อ`;

      const form = document.getElementById('quizForm');
      form.innerHTML = '';

      if (quizList.length === 0) {
        form.innerHTML = '<p>ยังไม่มีข้อสอบในบทนี้</p>';
        return;
      }

      quizList.forEach(q => {
        const div = document.createElement('div');
        div.className = 'q-box';
        let htmlChoices = '';
        q.choices.forEach((choice, idx) => {
          const safeChoice = choice.replace(/"/g, '&quot;');
          htmlChoices += `
            <label class="choice">
              <input type="radio" name="q_${q.rowNumber}" value="${safeChoice}" />
              ${idx + 1}. ${choice}
            </label>`;
        });
        div.innerHTML = `<div><b>ข้อที่ ${q.index}:</b> ${q.question}</div>${htmlChoices}`;
        form.appendChild(div);
      });

      const submitBtn = document.createElement('button');
      submitBtn.type = 'submit';
      submitBtn.textContent = 'ส่งคำตอบและบันทึกคะแนน';
      form.appendChild(submitBtn);
    });
  }

  function submitQuiz(e) {
    e.preventDefault();
    const ch = Number(document.getElementById('chapterSelect').value);
    const answers = {};
    quizList.forEach(q => {
      const checked = document.querySelector(`input[name="q_${q.rowNumber}"]:checked`);
      answers[q.rowNumber] = checked ? checked.value : '';
    });

    callServer('submitQuizResult', { user: currentUser, chapter: ch, answers: answers }, (err, res) => {
      if (err || !res) return;
      document.getElementById('quizResult').innerHTML = `
        <div class="kpi">
          <div><b>คะแนนที่ได้:</b> ${res.score} / ${res.fullScore} (${res.percent}%) — <b>สถานะ:</b> ${res.status}</div>
          <div class="muted" style="margin-top:4px;">บันทึกผลลงชีต "ผลการเรียนและแบบฝึกหัด" เรียบร้อยแล้ว</div>
        </div>`;
      loadHistory();
    });
  }

  function saveNewQuestion() {
    const questionData = {
      chapter: document.getElementById('addChapter').value,
      weight: document.getElementById('addWeight').value,
      question: document.getElementById('addQuestion').value,
      choice1: document.getElementById('addC1').value,
      choice2: document.getElementById('addC2').value,
      choice3: document.getElementById('addC3').value,
      choice4: document.getElementById('addC4').value,
      answer: document.getElementById('addAnswer').value
    };

    callServer('addQuestion', { user: currentUser, questionData }, (err, res) => {
      const msg = document.getElementById('addMsg');
      if (err || !res || !res.ok) {
        msg.innerHTML = `<span class="err-text">${(res && res.message) || 'เพิ่มข้อสอบไม่สำเร็จ'}</span>`;
        return;
      }
      msg.innerHTML = `<span class="ok-text">${res.message} (บทนี้มี ${res.chapterCount} ข้อ · รวมทั้งคลัง ${res.totalQuestions} ข้อ)</span>`;
      ['addQuestion', 'addC1', 'addC2', 'addC3', 'addC4', 'addAnswer'].forEach(id => {
        document.getElementById(id).value = '';
      });
      refreshStats();
    });
  }

  function loadHistory() {
    const wrap = document.getElementById('historyContent');
    if (!currentUser) {
      wrap.innerHTML = 'กรุณาลงชื่อเข้าใช้ก่อนดูประวัติ';
      return;
    }
    callServer('getLearningHistory', { user: currentUser }, (err, records) => {
      if (err || !records || records.length === 0) {
        wrap.innerHTML = '<p>ยังไม่มีประวัติการทำแบบฝึกหัด</p>';
        return;
      }
      let html = `<table><thead><tr>
        <th>User</th><th>ชื่อผู้ใช้</th><th>โรงเรียน</th><th>หน่วยที่</th><th>คะแนน</th><th>สถานะ</th><th>วันที่บันทึก</th>
      </tr></thead><tbody>`;
      records.forEach(r => {
        html += `<tr>
          <td>${r.username}</td>
          <td>${r.fullName}</td>
          <td>${r.school}</td>
          <td>${r.unit}</td>
          <td>${r.score} / ${r.fullScore}</td>
          <td>${r.status}</td>
          <td>${r.recordedAt}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;
    });
  }
</script>
</body>
</html>
